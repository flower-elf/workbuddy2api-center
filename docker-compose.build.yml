# 本地源码构建（开发者 / 修改代码测试用）：
#   docker compose -f docker-compose.build.yml up -d --build
services:
  wb-proxy-center:
    build: .
    image: wb-proxy-center:local
    container_name: wb-proxy-center
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      - HOST=0.0.0.0
      - PORT=8788
      # - API_KEY=your_api_key_here
      - TZ=Asia/Shanghai
    volumes:
      - ./accounts:/app/accounts
      - ./usage:/app/usage
