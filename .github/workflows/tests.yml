name: tests

# push 只覆盖 main；其它分支与 PR 由 pull_request 覆盖，同一次提交不会重复触发矩阵。
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个版本失败不取消其它版本，便于看出哪个解释器出问题。
      fail-fast: false
      matrix:
        include:
          # README 声明支持 Python 3.9+，最低版本在 Linux 上验证；主平台 Windows 运行当前版本。
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # 看板模块与 JS 套件是不带 package.json 的 ESM 文件，依赖 Node 22 起默认开启的模块语法识别。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run every suite
        run: python tests/run_all.py
